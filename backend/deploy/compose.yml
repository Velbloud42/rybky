# Rybky backend na malině. Lokálně http://192.168.1.13:8090, zvenku přes Cloudflare tunel.
# Vedle tohohle souboru musí ležet server.py, admin.py, match.py, admin.html a složka web (úvodní stránka /intro).
services:
  rybky:
    build: .
    image: rybky-backend
    container_name: rybky
    restart: unless-stopped
    command: python -u /app/server.py 8000
    environment:
      - RYBKY_DB=/data/rybky.db
      - ADMIN_RP_ID=rybky.pravn.uk
      - ADMIN_ORIGIN=https://rybky.pravn.uk
      # Klíč k Mapy.com pro mapku v adminu – jen v souboru .env vedle compose.yml, ne v repu.
      - MAPY_API_KEY=${MAPY_API_KEY:-}
    ports:
      - "8090:8000"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./admin.py:/app/admin.py:ro
      - ./match.py:/app/match.py:ro
      - ./admin.html:/app/admin.html:ro
      - ./web:/app/web:ro
      - ./data:/data
    mem_limit: 512m
